name: Emdad ERP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

      - name: Build Production Bundle & PWA
        run: npm run build

      - name: Verify Release & SHA256SUMS
        run: npm run check:release
